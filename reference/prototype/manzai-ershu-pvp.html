<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>满载而鼠：红蓝对战</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
:root{
  --bg:#efe6d4; --panel:rgba(255,250,240,.96); --ink:#2a2234; --sub:#6d6177; --accent:#f0862a; --accent-ink:#ffffff;
  --chip:#f3e8d6; --line:rgba(42,34,52,.12); --stage:#1d1830; --shadow:0 20px 60px rgba(25,15,40,.35);
  --font-display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15121f;--panel:rgba(32,27,48,.96);--ink:#f5ede0;--sub:#b4a7c4;--accent:#ff9440;--accent-ink:#1d1424;--chip:#2b2540;--line:rgba(255,255,255,.1);--shadow:0 20px 60px rgba(0,0,0,.55);}
}
:root[data-theme="dark"]{--bg:#15121f;--panel:rgba(32,27,48,.96);--ink:#f5ede0;--sub:#b4a7c4;--accent:#ff9440;--accent-ink:#1d1424;--chip:#2b2540;--line:rgba(255,255,255,.1);--shadow:0 20px 60px rgba(0,0,0,.55);}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--stage);}
body{height:100%;margin:0;background:var(--stage);color:var(--ink);font-family:var(--font-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:var(--stage);}
#gl,#game{position:absolute;inset:0;display:block;width:100%;height:100%;}
#gl{pointer-events:none;}
#game{touch-action:none;outline:none;}
#game.nocursor{cursor:none;}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box;background:radial-gradient(ellipse at center,rgba(20,14,34,.2),rgba(12,8,22,.62));z-index:5;overflow:auto;}
.overlay.hidden{display:none;}
.card{background:var(--panel);color:var(--ink);border-radius:26px;box-shadow:var(--shadow);border:1px solid var(--line);padding:18px 24px 22px;width:100%;max-width:500px;box-sizing:border-box;text-align:center;margin:auto;}
.hero{display:block;margin:0 auto 2px;width:170px;height:auto;}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,8vw,60px);line-height:1.02;margin:0 0 6px;letter-spacing:4px;}
h2{font-family:var(--font-display);font-weight:400;font-size:32px;margin:2px 0 4px;}
.tag{display:inline-block;font-size:13px;color:var(--sub);background:var(--chip);border-radius:999px;padding:3px 12px;margin:0 0 10px;}
.pitch{font-size:15px;line-height:1.7;margin:0 0 12px;}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 12px;text-align:left;font-size:13px;line-height:1.5;color:var(--sub);background:var(--chip);border-radius:16px;padding:10px 14px;margin:0 0 16px;}
.k{display:inline-block;min-width:16px;padding:0 6px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:12px;text-align:center;margin-right:5px;font-weight:600;}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;}
button{font:inherit;}
button.big{font-family:var(--font-display);font-size:22px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:11px 36px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22);}
button.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22);}
button.ghost{font-size:15px;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:9px 20px;cursor:pointer;}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.err{font-size:13px;color:#d64545;margin:10px 0 0;line-height:1.5;}
button.big:disabled{opacity:.45;cursor:not-allowed;}
.best{font-size:12px;color:var(--sub);margin-top:10px;min-height:16px;}
.rank{font-family:var(--font-display);font-size:76px;line-height:1;margin:0;}
.sub{color:var(--sub);font-size:14px;margin:0 0 12px;line-height:1.6;}
.loot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 10px;}
.li{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:12px;padding:5px 10px;font-size:14px;}
.li img{width:26px;height:26px;}
.li.lost{opacity:.5;text-decoration:line-through;}
.ctrl .wide{grid-column:1/-1;color:var(--accent);}
.total{font-family:var(--font-display);font-size:24px;margin:2px 0 6px;}
.stats{font-size:13px;color:var(--sub);margin:0 0 14px;}
@media (max-height:520px){
  .hero{width:84px;margin-bottom:-4px;}
  h1{font-size:34px;margin-bottom:2px;}
  .tag{margin-bottom:6px;}
  .pitch{font-size:13px;margin-bottom:8px;line-height:1.5;}
  .ctrl{font-size:12px;padding:8px 10px;margin-bottom:10px;}
  .card{padding:12px 18px 14px;}
  .rank{font-size:50px;}
  h2{font-size:26px;}
}
@media (prefers-reduced-motion: reduce){button.big:active{transform:none;}}
.lobby{display:grid;gap:8px;text-align:left;margin:0 0 12px;}
.lobby .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.lobby .lab{font-size:13px;color:var(--sub);min-width:56px;}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px;}
.seg button{font:inherit;font-size:13px;border:none;background:transparent;color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;}
.seg button.on{background:var(--accent);color:var(--accent-ink);}
.seg button[data-v="blue"].on{background:#3a7bd5;color:#fff;}
.seg button[data-v="red"].on{background:#e04848;color:#fff;}
.step{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:3px 6px;}
.step button{font:inherit;border:none;background:var(--panel);color:var(--ink);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;}
.step b{min-width:16px;text-align:center;font-size:14px;}
.tm{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;}
.tm.b{background:#3a7bd5;}.tm.r{background:#e04848;}
#rStats table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
#rStats td,#rStats th{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line);}
#rStats th{color:var(--sub);font-weight:600;}
.card{max-width:540px;}
.mcard{max-width:400px;width:calc(100% - 32px);display:flex;flex-direction:column;align-items:center;gap:8px;}
.mhero{width:min(230px,62%);height:auto;max-height:170px;object-fit:contain;}
.mtitle{font-size:44px;margin:0;letter-spacing:2px;}
.msub{font-size:14px;color:var(--sub);margin-bottom:6px;}
.mbtns{display:flex;flex-direction:column;gap:10px;width:100%;}
.mbtns .big,.mbtns .wide{width:100%;}
.mrow{display:flex;gap:8px;width:100%;}.mrow .ghost{flex:1;}
.mfoot{font-size:12px;color:var(--sub);margin-top:4px;}
@media (max-height:540px){.mhero{max-height:84px;}.mtitle{font-size:30px;}}
.codex{max-width:1040px;width:calc(100% - 20px);height:calc(100% - 20px);max-height:700px;display:flex;flex-direction:column;text-align:left;padding:14px 16px;}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.chead h2{margin:0;}
.ctabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.ctabs button{font:inherit;font-size:13px;border:none;background:var(--chip);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer;}
.ctabs button.on{background:var(--accent);color:var(--accent-ink);}
.cgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;align-content:start;padding-right:4px;}
.ccard{display:flex;gap:10px;background:var(--chip);border-radius:14px;padding:10px;align-items:flex-start;}
.ccard img{width:76px;height:76px;flex:none;object-fit:contain;background:#1d1530;border-radius:12px;}
.cinfo{min-width:0;}
.cname{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.crar{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;color:#1a1226;}
.cdesc{font-size:12.5px;margin:3px 0 4px;line-height:1.45;}
.cstat{font-size:12px;color:var(--sub);line-height:1.5;}
.cload{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0;}
.overlay{overflow-y:auto;}
.card.wide{max-width:900px;width:calc(100% - 28px);display:grid;grid-template-columns:minmax(190px,0.75fr) 1.25fr;gap:6px 26px;align-items:center;}
.card.wide .colL{text-align:center;min-width:0;}
.card.wide .colR{text-align:left;min-width:0;}
.card.wide .hero{width:min(230px,100%);height:auto;max-height:150px;object-fit:contain;}
.card.wide .pitch{margin-bottom:0;}
.card.wide .ctrl{margin:0 0 12px;}
@media (max-height:560px){.card.wide .hero{max-height:92px;}.card.wide h1{font-size:30px;margin:2px 0;}.card.wide .pitch{font-size:13px;}}
@media (max-width:640px){.card.wide{grid-template-columns:1fr;}.card.wide .colR{text-align:center;}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="game" tabindex="0" aria-label="满载而鼠 游戏画面"></canvas>
  <div id="menu" class="overlay">
    <div class="card mcard">
      <img id="menuHero" class="mhero" alt="满载而鼠的仓鼠">
      <h1 class="mtitle">满载而鼠</h1>
      <div class="msub">红蓝对战 · 肉鸽升级 · 黑暗视野</div>
      <div class="mbtns">
        <button class="big" id="mPlay">开始游戏</button>
        <button class="ghost wide" id="mCodex">图鉴</button>
        <div class="mrow"><button class="ghost" id="mMute">音效：开</button><button class="ghost" id="mFx">特效：强烈</button></div>
      </div>
      <div class="mfoot">键盘鼠标、手柄、触屏都能玩</div>
    </div>
  </div>
  <div id="codex" class="overlay hidden">
    <div class="card codex">
      <div class="chead"><h2>图鉴</h2><button class="ghost" id="codexClose">返回</button></div>
      <div class="ctabs" id="codexTabs"><button type="button" data-t="weapon" class="on">武器</button><button type="button" data-t="gadget">道具</button><button type="button" data-t="abil">强化</button><button type="button" data-t="talent">天赋</button><button type="button" data-t="pet">宠物</button><button type="button" data-t="mob">怪物</button><button type="button" data-t="scene">场景</button><button type="button" data-t="skin">形象</button></div>
      <div class="cgrid" id="codexGrid"></div>
    </div>
  </div>
  <div id="title" class="overlay hidden">
    <div class="card wide">
      <div class="colL">
        <img id="heroImg" class="hero" alt="满载而鼠的仓鼠">
        <h1>满载而鼠</h1>
        <div class="tag">红蓝对战（第一批内容）</div>
        <p class="pitch">打爆对方的仓鼠窝就赢。打怪、拆零食箱、击败对手攒经验，腮帮子塞满就升级，从武器、能力、宠物里三选一。</p>
      </div>
      <div class="colR">
        <div class="lobby">
          <div class="row"><span class="lab">模式</span><div class="seg" id="segMode"><button type="button" data-v="solo" class="on">单人</button><button type="button" data-v="duo">双人同屏</button></div></div>
          <div class="row"><span class="lab">玩家1</span><div class="seg" id="segP1"><button type="button" data-v="blue" class="on">蓝队</button><button type="button" data-v="red">红队</button></div></div>
          <div class="row"><span class="lab">形象</span><div class="seg" id="segS1"><button type="button" data-v="gold" class="on">金丝熊</button><button type="button" data-v="pudding">布丁</button><button type="button" data-v="silver">银狐</button><button type="button" data-v="stripe">三线</button></div></div>
          <div class="row" id="rowP2"><span class="lab">玩家2</span><div class="seg" id="segP2"><button type="button" data-v="blue">蓝队</button><button type="button" data-v="red" class="on">红队</button></div><div class="seg" id="segP2c"><button type="button" data-v="pad" class="on">手柄</button><button type="button" data-v="keys">方向键</button></div></div>
          <div class="row" id="rowS2"><span class="lab">玩家2形象</span><div class="seg" id="segS2"><button type="button" data-v="gold">金丝熊</button><button type="button" data-v="pudding" class="on">布丁</button><button type="button" data-v="silver">银狐</button><button type="button" data-v="stripe">三线</button></div></div>
          <div class="row"><span class="lab">AI 补位</span><span class="tm b">蓝</span><div class="step" data-t="blue"><button type="button" data-d="-1" aria-label="减少蓝队AI">−</button><b id="aiBlue">2</b><button type="button" data-d="1" aria-label="增加蓝队AI">+</button></div><span class="tm r">红</span><div class="step" data-t="red"><button type="button" data-d="-1" aria-label="减少红队AI">−</button><b id="aiRed">3</b><button type="button" data-d="1" aria-label="增加红队AI">+</button></div></div>
        </div>
        <div class="ctrl" id="ctrlText"></div>
        <div class="btns"><button class="big" id="startBtn">开始对局</button><button class="ghost" id="backMenu">返回</button></div>
        <p class="err" id="errText" hidden></p>
      </div>
    </div>
  </div>
  <div id="pause" class="overlay hidden">
    <div class="card">
      <h2>暂停</h2>
      <p class="sub">对局还在等你。</p>
      <div class="btns">
        <button class="big" id="resumeBtn">继续</button>
        <button class="ghost" id="restartBtn">重新开始</button>
        <button class="ghost" id="lobbyBtn2">返回大厅</button>
        <button class="ghost" id="muteBtn">音效：开</button>
        <button class="ghost" id="fxBtn">特效：强烈</button>
      </div>
    </div>
  </div>
  <div id="result" class="overlay hidden">
    <div class="card">
      <div class="rank" id="rRank">蓝</div>
      <h2 id="rTitle">蓝队胜利！</h2>
      <p class="sub" id="rSub"></p>
      <div id="rStats"></div>
      <div class="btns" style="margin-top:12px"><button class="big" id="againBtn">再来一局</button><button class="ghost" id="lobbyBtn">返回大厅</button></div>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const d2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const damp=(c,t,k,dt)=>c+(t-c)*(1-Math.exp(-k*dt));
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;else if(d<-Math.PI)d+=TAU;return d;}
function turnTo(a,b,m){return a+clamp(angDiff(a,b),-m,m);}
function spring(s,t,k,c,dt){s.w+=((t-s.v)*k-s.w*c)*dt;s.v+=s.w*dt;}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const FONT='"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_UI='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

// ---------- 合成音效 ----------
const SFX=(()=>{
  let ac=null,out=null,nb=null,muted=false;const last={};
  function init(){try{if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;out=ac.createGain();out.gain.value=muted?0:0.6;out.connect(comp);comp.connect(ac.destination);const n=Math.floor(ac.sampleRate*1.2);nb=ac.createBuffer(1,n,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();o.frequency.value=58;o2.type='triangle';o2.frequency.value=117;g.gain.value=0.016;o.connect(g);o2.connect(g);g.connect(out);o.start();o2.start();}if(ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
  function ok(k,gap){if(!ac||muted)return false;if(k){const t=ac.currentTime;if(last[k]!=null&&t-last[k]<gap)return false;last[k]=t;}return true;}
  function tone(type,f0,f1,dur,vol,delay=0){const t0=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(out);o.start(t0);o.stop(t0+dur+0.03);}
  function noise(dur,vol,ft,f0,f1,q=1,delay=0){const t0=ac.currentTime+delay,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(g);g.connect(out);s.start(t0,Math.random()*0.5,dur+0.05);}
  return{init,
    get muted(){return muted;},get ac(){return ac;},get bus(){return out;},
    setMuted(m){muted=m;if(out)out.gain.value=m?0:0.6;},
    shoot(){if(!ok('shoot',0.03))return;const k=rand(0.92,1.08);noise(0.07,0.3,'bandpass',2600*k,700,0.8);tone('square',260*k,80,0.08,0.1);tone('sine',150,50,0.1,0.22);},
    empty(){if(ok('empty',0.15))tone('square',1800,1700,0.025,0.07);},
    reload(){if(!ok('reload',0.2))return;tone('square',900,700,0.03,0.07);noise(0.12,0.1,'highpass',3000,2000,0.7,0.07);},
    reloaded(){if(!ok('reloaded',0.2))return;tone('square',1200,900,0.03,0.09);tone('square',700,500,0.04,0.09,0.06);},
    hit(){if(ok('hit',0.035))tone('triangle',rand(850,1000),420,0.05,0.12);},
    ratDie(){if(!ok('die',0.05))return;tone('sine',1500,2400,0.07,0.15);tone('sine',2200,700,0.16,0.13,0.07);noise(0.12,0.14,'lowpass',1800,300,0.7);},
    roachDie(){if(!ok('die',0.05))return;noise(0.09,0.28,'lowpass',3000,400,1.2);tone('square',180,60,0.07,0.09);},
    hurt(){if(!ok('hurt',0.08))return;tone('sine',380,120,0.18,0.3);tone('triangle',1200,1800,0.06,0.07,0.02);noise(0.1,0.18,'lowpass',1200,200);},
    munch(f){if(!ok('munch',0.04))return;const b=260+f*520;tone('sine',b,b*1.6,0.07,0.2);noise(0.05,0.07,'bandpass',1500,900,2,0.01);},

const HC=128,HMAP=new Map();
function hashAll(){HMAP.clear();const add=e=>{const r=e.r,x0=Math.floor((e.x-r)/HC),x1=Math.floor((e.x+r)/HC),y0=Math.floor((e.y-r)/HC),y1=Math.floor((e.y+r)/HC);for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const k=cx*1000+cy;let a=HMAP.get(k);if(!a)HMAP.set(k,a=[]);a.push(e);}};
  for(const p of props)if(!p.dead)add(p);for(const d of decoys)if(!d.dead)add(d);for(const h of hams)if(h.alive)add(h);for(const m of minions)if(!m.dead)add(m);for(const m of mobs)if(!m.dead)add(m);for(const s of structs)if(!s.dead)add(s);for(const c of crates)if(!c.dead)add(c);}
function hashAt(x,y){return HMAP.get(Math.floor(x/HC)*1000+Math.floor(y/HC))||EMPTY;}
function hashRange(x,y,r,fn){const x0=Math.floor((x-r)/HC),x1=Math.floor((x+r)/HC),y0=Math.floor((y-r)/HC),y1=Math.floor((y+r)/HC),seen=new Set();for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=HMAP.get(cx*1000+cy);if(!a)continue;for(const e of a){if(seen.has(e))continue;seen.add(e);fn(e);}}}

function nearestFoe(team,x,y,R,noCrate=true){let best=null,bd=R*R;hashRange(x,y,R,e=>{if(!canHit(team,e)||e.isProp||(noCrate&&e.kind==='crate')||(e.kind==='base'&&e.shielded))return;const d=d2(x,y,e.x,e.y);if(d<bd){bd=d;best=e;}});return best;}

const PROPDEF={lamp:{r:14,hp:30,resp:45,ht:70},barrel:{r:18,hp:40,resp:50,ht:44},box:{r:40,hp:140,resp:60,ht:60}};
function setupProps(){props=[];for(let i=solids.length-1;i>=0;i--)if(solids[i].prop)solids.splice(i,1);
  for(const d of propSpots){const D=PROPDEF[d.kind],p={kind:d.kind,isProp:true,id:UID++,team:'neutral',x:d.x,y:d.y,r:D.r,hp:D.hp,maxHp:D.hp,dead:false,flash:0,respT:0,solid:null,rot:(d.x*0.013+d.y*0.007)%TAU};
    p.solid=d.kind==='box'?{x:d.x-35,y:d.y-35,w:70,h:70,kind:'pbox',ht:D.ht,prop:p}:{c:true,x:d.x,y:d.y,r:D.r,kind:'p'+d.kind,ht:D.ht,prop:p};solids.push(p.solid);props.push(p);navPatch(p);}}
function navPatch(p){if(!NAV.pass)return;const R=70,c0=Math.max(0,Math.floor((p.x-R)/NAV.cell)),c1=Math.min(NAV.gc-1,Math.floor((p.x+R)/NAV.cell)),r0=Math.max(0,Math.floor((p.y-R)/NAV.cell)),r1=Math.min(NAV.gr-1,Math.floor((p.y+R)/NAV.cell));for(let j=r0;j<=r1;j++)for(let i=c0;i<=c1;i++)NAV.pass[j*NAV.gc+i]=overlapsSolid((i+0.5)*NAV.cell,(j+0.5)*NAV.cell,20)?0:1;FCACHE.clear();}
function propHit(p,dmg,owner){if(p.dead)return;p.hp-=dmg;p.flash=0.1;if(p.kind==='box'&&Math.random()<0.5)addP({type:'dot',x:p.x+rand(-20,20),y:p.y+rand(-20,20),h:rand(20,50),vx:rand(-90,90),vy:rand(-90,90),vh:rand(60,160),life:0.5,size:3,col:'#c89359'});if(p.hp<=0)destroyProp(p,owner);}
function destroyProp(p,owner){p.dead=true;p.solid.off=true;navPatch(p);p.respT=G.t+PROPDEF[p.kind].resp;const q=sndAt(p.x,p.y);
  if(p.kind==='barrel')blastAll(p.x,p.y,150,85,owner);
  else if(p.kind==='lamp'){GSFX.glass(q.pan,q.vol);noise(p.x,p.y,'boom',0.6,null);sparks(p.x,p.y,60,'#fff1c0',fxn(10));for(let i=0;i<fxn(8);i++)addP({type:'dot',x:p.x,y:p.y,h:60,vx:rand(-120,120),vy:rand(-120,120),vh:rand(40,140),life:rand(0.4,0.8),size:2.5,col:'#e8f6ff'});flashL('flash',p.x,p.y,60,1.5,0.15);}
  else{SFX.open();for(let i=0;i<fxn(16);i++){const a=rand(0,TAU),sp=rand(60,240);addP({type:'fur',x:p.x,y:p.y,h:rand(10,50),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vh:rand(60,200),life:rand(0.5,1),size:rand(5,9),col:Math.random()<0.5?'#c89359':'#e6c58a'});}addP({type:'smoke',x:p.x,y:p.y,h:20,life:0.8,size:40,grow:30,col:'#b8a07a'});}}
function blastAll(x,y,R,dmg,owner){rocketBoom(x,y,20,R);shakeAt(x,y,0.35);setWave(x,y,0.4,0.8,0.7);let hit=null;
  hashRange(x,y,R+60,e=>{if(e.kind==='base'||e.kind==='turret'||e.dead||(e.kind==='ham'&&!e.alive))return;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d>R)return;const f=1-Math.max(0,d)/R*0.5,ow=owner&&e.team!==owner.team?owner:null;if(dealDmg(e,dmg*f,{team:'neutral',owner:ow,x,y})>0&&ow&&!e.isProp)hit=e;knock(e,e.x-x,e.y-y,320*f);});
  if(hit&&owner)hitMark(owner,hit);}
function updProps(dt){for(const p of props){p.flash=Math.max(0,p.flash-dt);if(p.dead&&G.t>=p.respT){let blocked=false;for(const h of hams)if(h.alive&&Math.hypot(h.x-p.x,h.y-p.y)<p.r+h.r+20)blocked=true;if(!blocked){p.dead=false;p.hp=p.maxHp;p.solid.off=false;navPatch(p);}else p.respT=G.t+2;}}
  for(let i=detQ.length-1;i>=0;i--){const d=detQ[i];d.t-=dt;if(d.t<=0){detQ.splice(i,1);blast(d.x,d.y,90,45,d.team,d.owner,220);}}}
function updPads(dt){for(const p of padSpots){p.anim=Math.max(0,p.anim-dt);}
  for(const h of hams){if(!h.alive||h.air||h.padCd>0)continue;for(const p of padSpots)if(d2(h.x,h.y,p.x,p.y)<30*30){launch(h,p);break;}}}
function launch(h,p){h.air={t:0,dur:1.15,x0:h.x,y0:h.y,x1:p.tx+rand(-25,25),y1:p.ty+rand(-25,25),hgt:170};h.padCd=1.6;h.rollT=0;h.vx=h.vy=0;p.anim=0.35;SFX.boing(true);noise(p.x,p.y,'pad',0.8,h);const q=hamSnd(h);GSFX.throw(q.pan,q.vol);ring(p.x,p.y,3,10,200,0.35,'#ffd166');shakeAt(p.x,p.y,0.15,h);toastH(h,'起飞！','#ffd166',0.9);}
function land(h){h.air=null;h.z=0;resolveCircle(h,h.r);ring(h.x,h.y,3,10,220,0.35,'#ffe2a8');for(let i=0;i<fxn(10);i++){const a=rand(0,TAU);addP({type:'smoke',x:h.x,y:h.y,h:4,vx:Math.cos(a)*rand(80,200),vy:Math.sin(a)*rand(80,200),vh:rand(10,40),life:rand(0.4,0.7),size:rand(10,16),grow:24,col:'#e9dfcc'});}
  shakeAt(h.x,h.y,0.3,h);SFX.thud();h.sq.v=0.6;h.sq.w=0;hashRange(h.x,h.y,120,e=>{if(!canHit(h.team,e)||e.kind==='base'||e.kind==='turret'||e.isProp)return;if(Math.hypot(e.x-h.x,e.y-h.y)<90+e.r){dealDmg(e,25*h.st.dmg,{team:h.team,owner:h,x:h.x,y:h.y});knock(e,e.x-h.x,e.y-h.y,260);}});}
function spawnSquad(h){let best=null;for(const l of ['top','mid','bot']){const p=lanePath(h.team,l);p.forEach((q,i)=>{const d=d2(q[0],q[1],h.x,h.y);if(!best||d<best.d)best={l,i,d};});}
  for(let i=0;i<3;i++){const m=mkMinion(h.team,best.l);m.x=h.x+rand(-30,30);m.y=h.y+rand(-30,30);m.wp=Math.min(best.i+1,m.path.length-1);minions.push(m);}ring(h.x,h.y,3,10,180,0.35,TCOL[h.team]);toastH(h,'小队报到！','#8de0a6',1.2);}

const VIS={blue:new Set(),red:new Set()};let visT=0;
function litBy(L,e){for(const s of L){const dx=e.x-s.x,dy=e.y-s.y,d=Math.hypot(dx,dy);if(d>s.r+e.r)continue;if(s.dir!==undefined&&d>e.r+24){const c=(dx*Math.cos(s.dir)+dy*Math.sin(s.dir))/(d||1);if(c<s.cos)continue;}if(s.los&&d>e.r+30&&!hasLOS(s.x,s.y,e.x,e.y))continue;return true;}return false;}
function computeVis(){const sh=[];for(const p of props)if(p.kind==='lamp'&&!p.dead)sh.push({x:p.x,y:p.y,r:300,los:true});for(const f of fires)sh.push({x:f.x,y:f.y,r:f.r+90,los:true});if(FLASH.boom.t>0)sh.push({x:FLASH.boom.x,y:FLASH.boom.y,r:340,los:true});
  for(const team of TEAMS){const V=VIS[team];V.clear();const L=sh.slice();
    for(const h of hams)if(h.alive&&h.team===team){const nv=!!h.tal.nightvision;L.push({x:h.x,y:h.y,r:(nv?260:150)+h.r,los:!nv});L.push({x:h.x,y:h.y,r:540*(nv?1.6:1),dir:h.aim,cos:0.8,los:true});}
    for(const s of structs)if(!s.dead&&s.team===team)L.push({x:s.x,y:s.y,r:s.kind==='base'?620:s.kind==='turret'?s.range+30:220,los:true});
    for(const m of minions)if(!m.dead&&m.team===team)L.push({x:m.x,y:m.y,r:120,los:true});
    const test=e=>{if(e.revealT>0||litBy(L,e))V.add(e);};
    for(const h of hams)if(h.alive&&h.team!==team&&(h.invisT<=0||h.revealT>0))test(h);
    for(const m of minions)if(!m.dead&&m.team!==team)test(m);
    for(const e of mobs)if(!e.dead)test(e);
    for(const s of structs)if(!s.dead&&s.kind==='sentry'&&s.team!==team)test(s);
    for(const m of mines)if(m.team!==team){m.r=10;test(m);}}}

function aiHear(x,y,loud,src){const R=900*loud;for(const h of hams){if(h.ctl!=='ai'||!h.alive||(src&&src.team===h.team)||h.ai.target)continue;const d=Math.hypot(h.x-x,h.y-y);if(d>R)continue;if(!h.ai.inv||d<Math.hypot(h.x-h.ai.inv.x,h.y-h.ai.inv.y))h.ai.inv={x:x+rand(-60,60),y:y+rand(-60,60),t:5};}}

function rrPath(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function ell(g,x,y,rx,ry,rot=0){g.beginPath();g.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),rot,0,TAU);g.fill();}
function circle(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(0.01,r),0,TAU);g.fill();}
function star(g,x,y,r,rot){g.beginPath();for(let i=0;i<8;i++){const a=rot+i*Math.PI/4,rr=i%2?r*0.38:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();g.fill();}

  g.restore();
}

function drawHamGun(g,R,o,face){
  g.save();g.translate(face*R*0.5,-R*0.78);g.rotate(o.aim);if(face<0)g.scale(1,-1);g.translate(-o.kick,0);
  g.fillStyle='#2d3846';rrPath(g,-R*0.25,-R*0.2,R*1.3,R*0.38,R*0.12);g.fill();
  g.fillStyle='#4fae8f';rrPath(g,R*0.05,-R*0.3,R*0.62,R*0.14,R*0.06);g.fill();
  g.fillStyle='#1d242e';rrPath(g,R*1.0,-R*0.12,R*0.48,R*0.22,R*0.06);g.fill();
  g.fillStyle='#86d65b';circle(g,R*0.35,R*0.26,R*0.19);g.fillStyle='#b8f08a';circle(g,R*0.3,R*0.2,R*0.07);
  g.fillStyle='#ffe3c6';circle(g,-R*0.12,R*0.12,R*0.17);circle(g,R*0.62,R*0.08,R*0.14);
  g.restore();
}
function drawHamster(g,x,y,R,o){
  const face=Math.cos(o.aim)>=0?1:-1,fl=o.flash;
  g.save();g.translate(x,y);
  if(o.shadow!==false){g.fillStyle='rgba(0,0,0,.28)';ell(g,0,0,R*1.15,R*0.45);}
  const bob=o.moving?Math.abs(Math.sin(o.walk))*R*0.16:Math.sin(o.t*2.4)*R*0.03;
  g.translate(0,-bob);const sq=clamp(o.sq,0.6,1.5);g.scale(sq,2-sq);
  if(o.rollA){g.translate(0,-R*0.95);g.rotate(o.rollA);g.translate(0,R*0.95);}
  const aimUp=Math.sin(o.aim)<-0.35;
  if(o.gun&&aimUp)drawHamGun(g,R,o,face);
  const fp=o.moving?Math.sin(o.walk):0;
  g.fillStyle=fl?'#fff':'#f7b2a8';ell(g,-R*0.42,-R*0.1+fp*R*0.1,R*0.26,R*0.17);ell(g,R*0.42,-R*0.1-fp*R*0.1,R*0.26,R*0.17);
  g.fillStyle=fl?'#fff':'#eba557';ell(g,0,-R*0.98,R*1.08,R*0.98);
  g.fillStyle=fl?'#fff':'#d98b3f';ell(g,0,-R*1.55,R*0.78,R*0.38);
  for(const sx of[-1,1]){g.fillStyle=fl?'#fff':'#d98b3f';circle(g,sx*R*0.62,-R*1.72,R*0.3);g.fillStyle='#ffb2b0';circle(g,sx*R*0.62,-R*1.72,R*0.17);}
  g.fillStyle=fl?'#fff':'#fff2df';ell(g,0,-R*0.55,R*0.7,R*0.5);
  const pf=clamp(o.puff,0,1.25),cr=R*(0.3+0.5*pf),cx=R*(0.56+0.46*pf),cy=-R*(0.95-0.05*pf);
  g.fillStyle=fl?'#fff':'#ffe8cc';circle(g,-cx,cy,cr);circle(g,cx,cy,cr);
  g.strokeStyle='rgba(160,100,50,.35)';g.lineWidth=Math.max(1,R*0.05);g.beginPath();g.arc(-cx,cy,cr,0,TAU);g.stroke();g.beginPath();g.arc(cx,cy,cr,0,TAU);g.stroke();
  g.fillStyle='rgba(255,120,130,.42)';ell(g,-cx-cr*0.1,cy+cr*0.2,cr*0.45,cr*0.26);ell(g,cx+cr*0.1,cy+cr*0.2,cr*0.45,cr*0.26);
  g.fillStyle=fl?'#fff':'#fff2df';ell(g,0,-R*1.0,R*0.48,R*0.38);
  const lx=Math.cos(o.aim)*R*0.09,ly=Math.sin(o.aim)*R*0.07;
  g.lineCap='round';
  if(o.hurt){g.strokeStyle='#2a1d1d';g.lineWidth=R*0.09;for(const sx of[-1,1]){const ex=sx*R*0.36,ey=-R*1.24;g.beginPath();g.moveTo(ex-sx*R*0.12,ey-R*0.1);g.lineTo(ex+sx*R*0.04,ey);g.lineTo(ex-sx*R*0.12,ey+R*0.1);g.stroke();}}
  else for(const sx of[-1,1]){const ex=sx*R*0.36+lx,ey=-R*1.24+ly;g.fillStyle='#2a1d1d';ell(g,ex,ey,R*0.14,R*0.16);g.fillStyle='#fff';circle(g,ex-R*0.04,ey-R*0.06,R*0.05);}
  g.fillStyle='#ff8ea2';ell(g,lx*0.6,-R*1.04+ly*0.4,R*0.09,R*0.065);
  g.strokeStyle='#7a4a3a';g.lineWidth=Math.max(1,R*0.05);g.beginPath();
  const mx=lx*0.6,my=-R*0.93+ly*0.4;
  if(pf>0.55)g.arc(mx,my+R*0.03,R*0.06,0,TAU);else{g.moveTo(mx-R*0.14,my);g.quadraticCurveTo(mx-R*0.07,my+R*0.1,mx,my);g.quadraticCurveTo(mx+R*0.07,my+R*0.1,mx+R*0.14,my);}
  g.stroke();
  g.strokeStyle='rgba(90,60,40,.45)';g.lineWidth=Math.max(0.8,R*0.03);g.beginPath();for(const sx of[-1,1]){g.moveTo(sx*R*0.2,-R*1.0);g.lineTo(sx*R*0.62,-R*1.08);g.moveTo(sx*R*0.2,-R*0.96);g.lineTo(sx*R*0.6,-R*0.92);}g.stroke();
  if(o.gun&&!aimUp)drawHamGun(g,R,o,face);
  g.restore();
}

function pauseGame(){if(state!=='play')return;state='pause';show('pause',true);mouse.down=false;cv.style.cursor='default';}
function resumeGame(){if(state!=='pause')return;state='play';show('pause',false);try{cv.focus({preventScroll:true});}catch(e){}if(hams[0]&&hams[0].dev==='kbm')cv.style.cursor='none';}
function toLobby(){state='title';setupWorld();VIEWS=[mkView(null)];layoutViews();show('pause',false);show('result',false);show('menu',false);show('codex',false);show('title',true);cv.style.cursor='default';}
function showMenu(){show('title',false);show('codex',false);show('menu',true);}
function openLobby(){SFX.init();SFX.click();show('menu',false);show('title',true);}
const CODEX={imgs:null,tab:'weapon'};
function iconURL(draw,size=96){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');g.lineJoin='round';draw(g,size);return c.toDataURL();}
function codexImgs(){if(CODEX.imgs)return CODEX.imgs;const I={};
  for(const id in WEAPONS)I['w_'+id]=iconURL((g,S)=>draw2DWeapon(g,id,S/2,S/2,S*0.32,-0.25));
  for(const id in GADGETS)I['g_'+id]=iconURL((g,S)=>draw2DGadget(g,id,S/2,S/2+2,S*0.28));
  for(const id in ABIL)I['a_'+id]=iconURL((g,S)=>abilIcon(g,id,S/2,S/2,S*0.3,0));
  for(const id in TALENTS)I['t_'+id]=iconURL((g,S)=>talIcon(g,id,S/2,S/2,S*0.32));
  for(const id in PETS)I['p_'+id]=iconURL((g,S)=>draw2DPet(g,id,S/2,S/2,S*0.2));
  try{Object.assign(I,codexSnaps());}catch(e){console.error(e);}
  CODEX.imgs=I;return I;}
function codexList(tab){const I=codexImgs(),L=[],r0=n=>Math.round(n);
  if(tab==='weapon')for(const id in WEAPONS){const W=WEAPONS[id],st=[];
    if(W.kind==='bullet')st.push(`伤害 ${r0(W.dmg)}${(W.n||1)>1?' × '+W.n+' 发':''}　射速 ${W.rate}/秒`);
    else if(W.kind==='rocket'||W.kind==='lob')st.push(`爆炸伤害 ${r0(W.dmg+W.aoeDmg)}　半径 ${W.aoe}`);
    else if(W.kind==='melee')st.push(`伤害 ${W.dmg}　攻速 ${W.rate}/秒　距离 ${W.reach}`);
    else if(W.kind==='flame')st.push(`每发伤害 ${W.dmg}，会点燃敌人`);
    else if(W.kind==='rail')st.push(`蓄力伤害 ${W.dmg}～${W.dmg+140}，贯穿整条线`);
    else if(W.kind==='laser')st.push(`持续伤害约 ${r0(W.dmg*W.rate)}/秒`);
    if(W.mag)st.push(`弹匣 ${W.mag}　换弹 ${W.rl} 秒`);
    if(W.range&&W.kind!=='melee')st.push(W.eff&&W.eff<1?`射程 ${W.range}（有效 ${r0(W.range*W.eff)}，超出后伤害衰减）`:`射程 ${W.range}`);
    st.push('进化路线：'+EVO[id].map(p=>p[0]).join(' / '));L.push({img:I['w_'+id],name:W.name,desc:(id==='pistol'?'开局默认武器。':'')+WDESC[id],stats:st});}
  else if(tab==='gadget')for(const id in GADGETS){const G0=GADGETS[id];L.push({img:I['g_'+id],name:G0.name,desc:G0.desc+(id==='frag'?'。开局默认道具':''),stats:[`冷却 ${G0.cd} 秒`,'用升级卡可以升级：冷却更短、效果更强']});}
  else if(tab==='abil')for(const id in ABIL){const A=ABIL[id];L.push({img:I['a_'+id],name:A.name,desc:A.desc,stats:[`可以叠加 ${A.max} 次`]});}
  else if(tab==='talent')for(const id in TALENTS){const T0=TALENTS[id];L.push({img:I['t_'+id],name:T0.name,rar:'l',rarText:'天赋',desc:T0.desc,stats:['第 10、20、30 级三选一']});}
  else if(tab==='pet')for(const id in PETS)L.push({img:I['p_'+id],name:PETS[id].name,desc:PETS[id].desc,stats:['可以升级 3 次，伤害越来越高']});
  else if(tab==='mob'){
    L.push({img:I.m_roach,name:'蟑螂',desc:'成群住在野区的窝里，一靠近就整群冲上来咬人。',stats:['生命 28　速度很快','击败经验 6，有几率掉落瓜子']});
    L.push({img:I.m_rat,name:'鼠帮枪手',desc:'戴墨镜的老鼠，会蹲下瞄准（红色激光）后三连发，三只一伙守着野区。',stats:['生命 95','击败经验 16']});
    L.push({img:I.m_boss,name:'鼠王',rar:'l',rarText:'首领',desc:'开局 2 分钟后出现在地图上方中央。扇形弹幕、环形弹幕，还会召唤小弟。',stats:['生命 2600','击败后全队获得 60 秒王冠加成（伤害 +25%）','被击败后 150 秒重生']});
    L.push({img:I.m_minion,name:'小兵',desc:'双方每 30 秒在三条兵线各出 3 个，自动朝敌方推进。',stats:['生命 70','击败经验 7']});
    L.push({img:I.m_turret,name:'炮台',desc:'每方三座。优先打小兵，但你攻击敌方仓鼠时会被锁定。',stats:['生命 1700　射程 480','摧毁一座后，对方仓鼠窝的护盾消失']});}
  else if(tab==='scene'){
    L.push({img:I.s_pad,name:'超级弹射装置',desc:'踩上去翻着跟头飞进野区，空中可以开枪，落地有冲击波。',stats:['两边基地附近各两个']});
    L.push({img:I.s_barrel,name:'爆炸桶',desc:'打爆后范围爆炸，不分敌我，能连锁引爆。',stats:['50 秒后复原']});
    L.push({img:I.s_box,name:'纸箱掩体',desc:'挡子弹也挡视线，可以打碎。',stats:['60 秒后复原']});
    L.push({img:I.s_lamp,name:'落地灯',desc:'照亮周围一圈，被照到的敌人全队可见。打碎后这片区域变黑。',stats:['45 秒后修好']});
    L.push({img:I.s_crate,name:'零食箱',desc:'打开会掉落瓜子（经验），偶尔有回血奶酪。',stats:['40 秒后刷新']});
    L.push({img:I.s_bigcrate,name:'大礼箱',desc:'地图下方正中央，掉落一大堆经验和奶酪。',stats:['90 秒后刷新']});}
  else for(const sk in SKINS)L.push({img:I['k_'+sk],name:SKINS[sk].name,desc:{gold:'经典橙色配奶白肚皮。',pudding:'奶黄色的布丁仓鼠。',silver:'雪白带一点灰。',stripe:'灰色毛，背上有一道深色条纹。'}[sk],stats:['在开局设置里选择，AI 随机']});
  return L;}
function renderCodex(tab){CODEX.tab=tab;$('codexTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const g=$('codexGrid');
  g.innerHTML=codexList(tab).map(e=>`<div class="ccard"><img src="${e.img||''}" alt="${e.name}"><div class="cinfo"><div class="cname">${e.name}${e.rar?`<span class="crar" style="background:${RCOL[e.rar]}">${e.rarText||RNAME[e.rar]}</span>`:''}</div><div class="cdesc">${e.desc||''}</div>${(e.stats||[]).map(x=>`<div class="cstat">${x}</div>`).join('')}</div></div>`).join('');g.scrollTop=0;}
function openCodex(){SFX.init();SFX.click();show('menu',false);show('codex',true);if(!CODEX.imgs){$('codexGrid').innerHTML='<div class="cload">正在准备图鉴…</div>';setTimeout(()=>renderCodex(CODEX.tab),30);}else renderCodex(CODEX.tab);}
$('codexTabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{SFX.click();renderCodex(b.dataset.t);}));
$('codexClose').addEventListener('click',()=>{SFX.click();showMenu();});
$('mPlay').addEventListener('click',openLobby);$('mCodex').addEventListener('click',openCodex);$('backMenu').addEventListener('click',()=>{SFX.click();showMenu();});
$('mMute').addEventListener('click',()=>{SFX.init();SFX.setMuted(!SFX.muted);store.set('mz_mute',SFX.muted?1:0);updateMuteLabel();});
$('mFx').addEventListener('click',()=>{fxLevel=(fxLevel+1)%3;store.set('mz_fx',fxLevel);applyFx();});
function updateMuteLabel(){const l=SFX.muted?'音效：关':'音效：开';$('muteBtn').textContent=l;$('mMute').textContent=l;}
const FX_LEVELS=[['标准',0.7],['强烈',1.0],['爆炸',1.5]];let fxLevel=clamp(+store.get('mz_fx',1)||0,0,2);
function applyFx(){FXK=FX_LEVELS[fxLevel][1];$('fxBtn').textContent='特效：'+FX_LEVELS[fxLevel][0];$('mFx').textContent='特效：'+FX_LEVELS[fxLevel][0];}
$('startBtn').addEventListener('click',startMatch);$('againBtn').addEventListener('click',startMatch);$('restartBtn').addEventListener('click',startMatch);
$('resumeBtn').addEventListener('click',resumeGame);$('lobbyBtn').addEventListener('click',toLobby);$('lobbyBtn2').addEventListener('click',toLobby);
$('muteBtn').addEventListener('click',()=>{SFX.init();SFX.setMuted(!SFX.muted);store.set('mz_mute',SFX.muted?1:0);updateMuteLabel();});
$('fxBtn').addEventListener('click',()=>{fxLevel=(fxLevel+1)%3;store.set('mz_fx',fxLevel);applyFx();});
let titleT=0;
function titleUpdate(dt){titleT+=dt;const v=VIEWS[0];if(!v)return;v.camX=MIDX+Math.sin(titleT*0.045)*1800;v.camY=MIDY+Math.sin(titleT*0.07+1)*700;clampView(v);for(const e of mobs)e.t+=dt;for(const s of structs)s.aim+=dt*0.3*(s.team==='blue'?1:-1);updFX(dt);}
let lastT=0,pfA=0,pfN=0,pfGood=0;
function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(0.05,Math.max(0.001,(now-(lastT||now))/1000));lastT=now;RDT=rdt;time+=rdt;
  pfA+=rdt;pfN++;if(pfA>=1){const fps=pfN/pfA;if(fps<44&&RS>0.6){RS=Math.max(0.6,RS-0.1);pfGood=0;}else if(fps>57){if(++pfGood>=3&&RS<1){RS=Math.min(1,RS+0.1);pfGood=0;}}else pfGood=0;pfA=0;pfN=0;}
  const pads=getPads();
  for(let i=0;i<pads.length;i++){const gp=pads[i];if(!gp)continue;if(padEdge(i,gp,9)){if(state==='play')pauseGame();else if(state==='pause')resumeGame();}
    if(state==='play'&&padActive(gp)){if(LOBBY.mode==='solo'&&hams[0]&&hams[0].dev!=='pad')setDevP1('pad',i);const p2=hams.find(q=>q.ctl==='p2');if(p2&&p2.dev==='keys2'&&LOBBY.p2c==='pad'){p2.dev='pad';p2.padIdx=i;}}}
  if(state==='play'){for(const h of hams)if(h.ctl!=='ai')readLocal(h);
    if(hitstop>0)hitstop-=rdt;else{if(slowT>0){slowT-=rdt;timeScale=slowT>0?0.35:1;}else timeScale=1;const dt=rdt*timeScale,n=dt>0.02?2:1;for(let i=0;i<n&&state==='play';i++)update(dt/n);}}
  else if(state==='title')titleUpdate(rdt);else if(state==='result')updFX(rdt*0.5);
  keyEdge.clear();endPadFrame();
  for(const v of VIEWS)updToasts(v,rdt);
  if(gl){try{sync3D(rdt);draw3D();}catch(e){console.error(e);gl=null;$('errText').hidden=false;$('errText').textContent='3D 渲染出错了：'+e.message;}}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(state==='play'||state==='pause'||state==='result'){for(const v of VIEWS)if(v.ham)drawViewHUD(ctx,v);drawGlobalHUD(ctx);
    const p1=hams[0];if(state==='play'&&p1&&p1.dev==='touch')drawTouch(ctx);if(state==='play'&&p1&&p1.dev==='kbm')drawCross(ctx);}
}
function init(){
  buildMap();buildNav();resize();
  let ok=false;try{ok=initGL()!==false&&!!gl;}catch(e){console.error(e);ok=false;}
  if(ok){try{build3D();}catch(e){console.error(e);gl=null;ok=false;}}
  setupWorld();VIEWS=[mkView(null)];layoutViews();touchLayout();
  try{makeHero();}catch(e){console.error(e);}
  try{$('menuHero').src=$('heroImg').src;}catch(e){}
  if(!ok){$('errText').hidden=false;$('errText').textContent='你的浏览器没能启动 WebGL2 3D 渲染，这一版暂时玩不了。换用最新版 Chrome / Edge / Safari 再试试。';$('startBtn').disabled=true;}
  if(+store.get('mz_mute',0))SFX.setMuted(true);
  updLobby();updateMuteLabel();applyFx();
  window.addEventListener('resize',()=>{resize();layoutViews();touchLayout();});
  requestAnimationFrame(frame);
}
init();
})();


</script>
